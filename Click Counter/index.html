<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Click Counter</h1>
      <p class="subtitle">Count every tap and challenge your fastest fingers.</p>
      <div class="counter" id="counter">0</div>
      <div class="actions">
        <button id="increase">Click Me</button>
        <button id="decrease" class="secondary">Minus</button>
        <button id="reset" class="secondary">Reset</button>
      </div>
      <p class="message" id="message">Start clicking to raise the counter.</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
